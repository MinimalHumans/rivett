name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

env:
  # Artifact Signing, reached by OIDC as the app registration whose
  # federated credential trusts the `release` environment (none of
  # these are secrets).
  AZURE_CLIENT_ID: cea87653-01f1-4308-9988-8ca28c971a70
  AZURE_TENANT_ID: dbbfdd81-727c-4a58-a3f5-db66a2d489c1
  AZURE_SUBSCRIPTION_ID: e3fd192a-87a3-4645-aa51-6744c2be6469
  SIGNING_ENDPOINT: https://eus.codesigning.azure.net
  SIGNING_ACCOUNT: krets-signing
  SIGNING_PROFILE: scf-public-trust

jobs:
  build-windows:
    runs-on: windows-latest
    environment: release
    steps:
      - uses: actions/checkout@v5
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rivett
        run: cargo build --release
        
      - name: Log in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      # signtool plus Microsoft's Artifact Signing dlib, which takes its
      # credential from the azure/login session above (no client secret).
      - name: Set up signtool
        shell: pwsh
        run: |
          nuget install Microsoft.Trusted.Signing.Client -Version 1.0.60 -x -OutputDirectory "$env:RUNNER_TEMP/signing"
          $dlib = (Resolve-Path "$env:RUNNER_TEMP/signing/Microsoft.Trusted.Signing.Client/bin/x64/Azure.CodeSigning.Dlib.dll").Path
          $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}/Windows Kits/10/bin/10.*/x64/signtool.exe" |
            Sort-Object FullName | Select-Object -Last 1).FullName
          $metadata = "$env:RUNNER_TEMP/signing/metadata.json"
          @{
            Endpoint               = $env:SIGNING_ENDPOINT
            CodeSigningAccountName = $env:SIGNING_ACCOUNT
            CertificateProfileName = $env:SIGNING_PROFILE
          } | ConvertTo-Json | Set-Content $metadata

          'if (-not $args[0]) { throw "no file to sign" }',
          '& $env:SIGNTOOL sign /v /fd SHA256 /tr http://timestamp.acs.microsoft.com /td SHA256 /dlib $env:SIGNING_DLIB /dmdf $env:SIGNING_METADATA $args[0]',
          'if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }' | Set-Content "$env:RUNNER_TEMP/signing/sign.ps1"

          "SIGNTOOL=$signtool" >> $env:GITHUB_ENV
          "SIGNING_DLIB=$dlib" >> $env:GITHUB_ENV
          "SIGNING_METADATA=$metadata" >> $env:GITHUB_ENV

      - name: Sign rivett.exe
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP/signing/sign.ps1" "$PWD/target/release/rivett.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify signature
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature "target/release/rivett.exe"
          "target/release/rivett.exe : $($sig.Status)"
          if ($sig.Status -ne "Valid") { throw "target/release/rivett.exe is not validly signed" }
        
      - name: Package Portable ZIP
        run: |
          $VERSION = $env:GITHUB_REF_NAME -replace '^v', ''
          mkdir dist
          cp target/release/rivett.exe dist/
          cp README.md dist/
          Compress-Archive -Path dist/* -DestinationPath "rivett-${VERSION}-windows-portable.zip"

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: rivett-*-windows-portable.zip
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev squashfs-tools libwayland-dev libxkbcommon-dev libgtk-3-dev
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install packaging tools
        run: |
          cargo install cargo-bundle --locked
          cargo install cargo-deb --locked
      - name: Build release binary
        run: cargo build --release
      - name: Build AppImage
        run: cargo bundle --release --format appimage
      - name: Build Deb package
        # cargo-deb maps assets to correct system paths so AppStream metainfo
        # lands at /usr/share/metainfo/ (required for KDE Discover name lookup).
        run: cargo deb --no-build
      - name: Upload Linux Bundles
        uses: softprops/action-gh-release@v3
        with:
          files: |
            target/release/bundle/appimage/*.AppImage
            target/debian/*.deb
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    runs-on: macos-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-bundle
        run: cargo install cargo-bundle --locked
      - name: Build .app bundle
        run: cargo bundle --release --format osx
      - name: Sign and package .app bundle
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          codesign --force --deep --sign - target/release/bundle/osx/Rivett.app
          ditto -c -k --keepParent target/release/bundle/osx/Rivett.app rivett-${VERSION}-macos.zip
      - name: Upload macOS Bundle
        uses: softprops/action-gh-release@v3
        with:
          files: rivett-*-macos.zip
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
